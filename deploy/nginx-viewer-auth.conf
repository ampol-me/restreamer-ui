# Makes the viewer site's access rules hold for the core's own stream addresses.
# Put these blocks into the `server { … }` of the host that fronts the core, above its
# `location / { … }`. Adjust the two addresses (UI server, core) and the UI's base path (/app/).
#
# Stream files are then served directly only for channels set to "Public" on the Viewer site
# page; passcode channels play through the viewer site, and the signed-in admin sees everything.
# If the UI server is down, direct stream requests fail (nginx answers 500) – by design.

location = /_viewer_auth {
    internal;
    proxy_pass http://127.0.0.1:3080/app/api/viewer/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}

# In-memory streams (/memfs/…) and streams stored on disk (/<channel id>.m3u8, /<channel id>/…).
location ~ "^/(memfs/|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}[._/])" {
    auth_request /_viewer_auth;

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
}

# Optional: the host's front page is the viewer site instead of the core's old player page.
location ~ ^/(index\.html)?$ {
    return 302 /app/watch;
}

# Optional: short viewer links on the host itself (/watch, /watch/a4ff4073) lead into the app.
location ~ "^/watch(/[A-Za-z0-9-]{0,64})?/?$" {
    return 302 /app/watch$1;
}
